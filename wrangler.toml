name = "art2art"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Dominio propio (la zona debe estar activa en Cloudflare).
routes = [
  { pattern = "art2artestampados.com", custom_domain = true },
  { pattern = "www.art2artestampados.com", custom_domain = true },
  { pattern = "admin.art2artestampados.com", custom_domain = true },
]

# La app de Vite se compila a ./dist. El Worker solo se ejecuta para estas rutas;
# el resto de archivos estáticos (JS, CSS, imágenes) los sirve Cloudflare directo.
[assets]
directory = "./dist"
binding = "ASSETS"
# "/*-buga" son las paginas por servicio (sus rutas terminan en -buga): el Worker les aplica lo editado en D1.
# Una pagina nueva cuya ruta no termine en -buga debe agregarse aqui.
run_worker_first = ["/", "/admin", "/admin/*", "/api/*", "/img/*", "/*-buga"]
# Una direccion que no existe responde 404 con dist/404.html (antes devolvia la portada con codigo 200).
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "art2art-db"
database_id = "14ca45af-716c-4a2a-9777-10e8c23f46a7"
migrations_dir = "migrations"
